# Design-record build for the zenfmt monorepo.
#
# Every ZDS record compiles to a PDF and to a page of the browseable HTML
# bundle, and both are published to GitHub Pages:
#   https://insanai.github.io/zenfmt/
name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile design records
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15"

      # `zig build test` and `zig build fmt-check` include the Python
      # suite and Ruff gates through uv (ZDS 0014); missing uv is a hard
      # prerequisite failure by design.
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.11.6"
          enable-cache: true

      # Catches a record file with no registry.typ entry, and a registry entry
      # with no record file, before either reaches the published index.
      - name: Check the registry against the record files
        run: |
          set -eux
          zig build zds-list | tee zds-list.txt
          ! grep -q '^warning:' zds-list.txt

      - name: Check formatting and run the test suite
        run: |
          set -eux
          zig build fmt-check
          zig build test

      - name: Compile every record, the index, and the HTML bundle
        run: zig build docs

      - name: Assemble the Pages artifact
        run: |
          set -eux
          mkdir -p site
          cp -r docs/build/zds-site/. site/
          cp docs/build/zds-*.pdf site/pdf/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
